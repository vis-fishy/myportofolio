{% extends "base.html" %}
{% block meta %}
    <title>{{ name }} - Portfolio</title>
{% endblock meta %}
{% block content %}
    <div class="container hero-grid">
        <div class="hero-identity">
            <p class="kicker">Computer Science &middot; Universitas Indonesia</p>
            <h1>{{ full_name }}</h1>
        </div>
        <div class="hero-photo">
            <div class="photo-block"></div>
            <img class="avatar" src="/static/img/elvis.jpeg" alt="Photo of {{ name }}">
        </div>
        <div class="hero-details">
            <p class="bio">{{ bio }}</p>
            <dl class="meta-list">
                <div class="meta-row">
                    <dt>NPM</dt>
                    <dd>{{ npm }}</dd>
                </div>
                <div class="meta-row">
                    <dt>Program</dt>
                    <dd>{{ study_program }}</dd>
                </div>
            </dl>
            <div class="social-links">
                <a href="https://github.com/vis-fishy" class="social-link">GitHub</a>
                <a href="https://www.linkedin.com/in/elvis-sestomi" class="social-link">LinkedIn</a>
                <a href="mailto:sestomielvis@gmail.com" class="social-link">Email</a>
            </div>
        </div>
    </div>
{% endblock content %}
