{% extends "base.html" %}

{% block meta %}
    <title>Add Certification - {{ name }}</title>
    <link rel="stylesheet" href="/static/css/cert_form.css">
{% endblock meta %}

{% block content %}
    <div class="container">
        <h1>Add New Certifications</h1>
        <form method="post"
                action="{% url 'main:create_certification' %}"
                class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="button">Tambah Project</button>
            <a href="{% url 'main:show_certification' %}" class="button button-secondary">Batal</a>
        </form>
    </div>
{% endblock content %}
