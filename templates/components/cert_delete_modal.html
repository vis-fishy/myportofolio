
<button type="button"
        class="button button-danger"
        popovertarget="delete-cert-{{ cert.id }}"
        aria-label="Hapus {{ cert.title }}"
        title="Hapus proyek">
    Delete
</button>
<div id="delete-cert-{{ cert.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-cert-title-{{ cert.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-cert-{{ cert.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-cert-{{ cert.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-cert-title-{{ cert.id }}">Hapus Sertifikasi?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ cert.course_name }}</strong>?
        </p>
        <form method="post" action="{% url 'main:delete_cert' cert.id %}" class="project-delete-form"> <!--TODO: MAKE DELETE CERT-->
            {% csrf_token %}
            <div class="form-group">
                <input
                    type="password"
                    id="delete-password-{{ cert.id }}"
                    name="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>
            <div class="project-delete-modal__actions">

                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-cert-{{ cert.id }}"
                        popovertargetaction="hide">
                    Batal
                </button>

                <button type="submit"
                        class="button button-danger">
                    Ya, Hapus
                </button>

            </div>
        </form>
    </div>
</div>
